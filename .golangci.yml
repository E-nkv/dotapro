# yaml-language-server: $schema=https://golangci-lint.run/jsonschema/golangci.jsonschema.json
version: "2"

run:
  timeout: 5m
  concurrency: 4

linters:
  enable:
    - errcheck
    - goconst
    - govet
    - revive
    - staticcheck
    - unused

settings:
  staticcheck:
    checks: ["all", "-ST1000", "-ST1005"]
  revive:
    rules:
      - name: package-comments
        disabled: true
      - name: exported
        disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
